<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ============================================================= -->
<!-- ==  EDITA SOLO ESTA LÍNEA PARA CAMBIAR EL DESTINO DEL QR  == -->
<!-- ==  Cambia la URL de content="0; url=..." (deja el 0;)    == -->
<!-- ============================================================= -->
<meta http-equiv="refresh" content="0; url=https://store.steampowered.com/?l=spanish">
<!-- ============================================================= -->

<title> </title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: inherit; }
  /* La página se ve completamente vacía: el fallback solo aparece si a los 2 s
     no hubo redirección (meta refresh y JS bloqueados a la vez). */
  #fallback { display: none; }
</style>
</head>
<body>
  <main id="fallback">
    <p>No se pudo redirigir automáticamente.</p>
    <p><a id="destino" href="https://friv.com">Abrir el enlace</a></p>
  </main>

<script>
  // Toma la URL del <meta refresh> de arriba, así solo hay UN sitio que editar.
  (function () {
    var meta = document.querySelector('meta[http-equiv="refresh"]');
    var destino = meta && meta.content.replace(/^\s*\d+\s*;\s*url=/i, '').trim();
    if (!destino) return;
    document.getElementById('destino').href = destino;
    location.replace(destino);
    // Red de seguridad: si seguimos aquí a los 2 s, mostramos el enlace manual.
    setTimeout(function () {
      document.getElementById('fallback').style.display = 'block';
    }, 2000);
  })();
</script>
</body>
</html>
